name: Build Single-File Windows Setup

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-migration
    paths:
      - "agent/**"
      - ".github/workflows/build-windows-agent.yml"
      - ".github/workflows/build-single-file-setup.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements.txt pyinstaller

      - name: Build the monitoring agent executable
        working-directory: agent
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name EmployeeMonitorAgent --collect-all watchdog --hidden-import win32timezone agent.py

      - name: Build one-file setup executable
        working-directory: agent
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name EmployeeMonitor-Setup --add-binary "dist/EmployeeMonitorAgent.exe;payload" installer.py

      - name: Upload setup executable
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeMonitor-Setup
          path: agent/dist/EmployeeMonitor-Setup.exe
          if-no-files-found: error
          retention-days: 30
