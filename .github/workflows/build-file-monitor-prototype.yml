name: Build File Monitor ETW Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-migration
    paths:
      - "agent/file-monitor-prototype/**"
      - ".github/workflows/build-file-monitor-prototype.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained Windows executable
        run: |
          dotnet publish agent/file-monitor-prototype/FileMonitor.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload prototype
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeMonitor-FileMonitor-ETW-Test
          path: publish/EmployeeMonitor.FileMonitorPrototype.exe
          if-no-files-found: error
          retention-days: 30
